name: Deploy PeerDrive to Oracle & Build Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build Go Daemon AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          ~/go/bin/gomobile init
          mkdir -p mobile/android/app/libs
          cd core
          ~/go/bin/gomobile bind -target=android -o ../mobile/android/app/libs/Daemon.aar ./daemon

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Build Android APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../core/ui/peerdrive-android.apk

      - name: Build Server Binary
        working-directory: core
        run: |
          go test ./...
          CGO_ENABLED=1 go build -o peerdrive .

      - name: Package release
        run: tar -czf peerdrive-release.tar.gz -C core peerdrive ui

      - name: Upload release to Oracle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          source: peerdrive-release.tar.gz
          target: /home/${{ secrets.ORACLE_USER }}/peerdrive/releases/${{ github.sha }}/

      - name: Restart PeerDrive on Oracle
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            set -e
            release_dir="/home/${{ secrets.ORACLE_USER }}/peerdrive/releases/${{ github.sha }}"
            tar -xzf "$release_dir/peerdrive-release.tar.gz" -C "$release_dir"
            sudo mkdir -p /opt/peerdrive/current /var/lib/peerdrive
            sudo chown ubuntu:ubuntu /var/lib/peerdrive
            sudo chmod 755 /var/lib/peerdrive
            sudo install -m 0755 "$release_dir/peerdrive" /opt/peerdrive/current/peerdrive.new
            sudo rm -rf /opt/peerdrive/current/ui.new
            sudo cp -r "$release_dir/ui" /opt/peerdrive/current/ui.new
            sudo mv /opt/peerdrive/current/peerdrive.new /opt/peerdrive/current/peerdrive
            sudo rm -rf /opt/peerdrive/current/ui
            sudo mv /opt/peerdrive/current/ui.new /opt/peerdrive/current/ui
            sudo chown -R ubuntu:ubuntu /opt/peerdrive/current
            sudo systemctl restart peerdrive
