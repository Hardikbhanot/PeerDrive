name: Deploy PeerDrive to Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Build Server Binary
        working-directory: core
        run: |
          go test ./... || true
          go build -o peerdrive .

      - name: Package release
        run: tar -czf peerdrive-release.tar.gz -C core peerdrive ui

      - name: Upload release to Oracle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          source: peerdrive-release.tar.gz
          target: /home/${{ secrets.ORACLE_USER }}/peerdrive/releases/${{ github.sha }}/

      - name: Restart PeerDrive on Oracle
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            set -e
            release_dir="/home/${{ secrets.ORACLE_USER }}/peerdrive/releases/${{ github.sha }}"
            tar -xzf "$release_dir/peerdrive-release.tar.gz" -C "$release_dir"
            sudo mkdir -p /opt/peerdrive/current /var/lib/peerdrive
            sudo chown ubuntu:ubuntu /var/lib/peerdrive
            sudo chmod 755 /var/lib/peerdrive
            sudo install -m 0755 "$release_dir/peerdrive" /opt/peerdrive/current/peerdrive.new
            sudo rm -rf /opt/peerdrive/current/ui.new
            sudo cp -r "$release_dir/ui" /opt/peerdrive/current/ui.new
            sudo mv /opt/peerdrive/current/peerdrive.new /opt/peerdrive/current/peerdrive
            sudo rm -rf /opt/peerdrive/current/ui
            sudo mv /opt/peerdrive/current/ui.new /opt/peerdrive/current/ui
            sudo chown -R ubuntu:ubuntu /opt/peerdrive/current
            sudo systemctl restart peerdrive
