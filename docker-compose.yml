services:
  peerdrive:
    build:
      context: .
      dockerfile: Dockerfile
    image: peerdrive:local
    container_name: peerdrive
    ports:
      - "8085:8080"
    environment:
      PEERDRIVE_PUBLIC_URL: ${PEERDRIVE_PUBLIC_URL:-http://localhost:8085}
    volumes:
      - peerdrive_data:/data
    restart: unless-stopped

volumes:
  peerdrive_data:
